  canvas { display: block; margin: 0 auto; }

<body>
<script>
// ========== 配置 ==========
const PALETTE = {
  paper:'#f0e6d3', ink:'#2c2416', inkLight:'#5c5040', red:'#c41e3a',
  green:'#5b8c5a', gold:'#c9a96e', goldDark:'#8b7355', hpGreen:'#4a7c59',
  shield:'#5b7fa5', fire:'#d4843a', darkBg:'#1a1410', poison:'#7a5a2e',
};

// 24 张成语卡牌：攻/守/愈/强/破/反/窃/遁/毒/连
const IDIOMS = [
  {id:'yijianshuangdiao', name:'一箭双雕', type:'attack', cost:2, value:18, desc:'造成 18 点伤害'},
  {id:'guruojintang',     name:'固若金汤', type:'defense',cost:2, value:15, desc:'获得 15 点护盾'},
  {id:'huoshangjiaoyou',  name:'火上浇油', type:'attack', cost:1, value:8,  desc:'8 伤害，附加 2 回合灼烧'},
  {id:'wangyangbulao',    name:'亡羊补牢', type:'heal',  cost:2, value:12, desc:'回复 12 血 + 5 护盾'},
  {id:'fudichouxin',      name:'釜底抽薪', type:'debuff',cost:3, value:0,  desc:'移除敌方增益 + 10 伤害'},
  {id:'huashuoshidian',   name:'画龙点睛', type:'buff',  cost:1, value:0,  desc:'本回合伤害翻倍'},
  {id:'shengdongjixi',    name:'声东击西', type:'attack', cost:1, value:10, desc:'10 伤害，本回合闪避'},
  {id:'jiedaosharen',     name:'借刀杀人', type:'counter',cost:2, value:0,  desc:'本回合反弹 50% 伤害'},
  {id:'jinchantuoqiao',   name:'金蝉脱壳', type:'escape',cost:3, value:0,  desc:'血<30 时自动回 20 血'},
  {id:'shunshouqianyang', name:'顺手牵羊', type:'steal', cost:1, value:0,  desc:'偷取敌人 8 点生命'},
  {id:'yijuguqin',        name:'一鼓作气', type:'attack', cost:1, value:6,  desc:'6 伤害 ×连击次数(最多3)'},
  {id:'jingweitianhai',   name:'精卫填海', type:'heal',  cost:1, value:6,  desc:'回复 6 血，本回合+1 防御'},
  {id:'shijibudan',       name:'势如破竹', type:'attack', cost:3, value:26, desc:'26 点伤害，下回合-1 能量'},
  {id:'anshiduliang',     name:'暗度陈仓', type:'steal', cost:2, value:0,  desc:'偷 12 血，获得 6 护盾'},
  {id:'zouweishang',      name:'走为上计', type:'escape',cost:1, value:0,  desc:'立刻结束回合，恢复 5 血'},
  {id:'yiqiuhongru',      name:'一丘之貉', type:'debuff',cost:1, value:0,  desc:'敌人攻击力 -20%（本场战斗）'},
  {id:'zhishangtanbing',  name:'纸上谈兵', type:'buff',  cost:0, value:0,  desc:'抽 1 张牌，下回合能量+1'},
  {id:'guazhushishui',    name:'刮骨疗毒', type:'heal',  cost:3, value:25, desc:'回复 25 血，清除灼烧'},
  {id:'baimizhizhou',     name:'百密一疏', type:'debuff',cost:2, value:0,  desc:'敌人本回合伤害 -50%'},
  {id:'qianjunyifa',      name:'千钧一发', type:'attack', cost:2, value:0,  desc:'敌人血>50% 时造成 30 伤害'},
  {id:'sheshenchuren',    name:'舍身取义', type:'attack', cost:0, value:22, desc:'22 伤害，自身损失 6 血'},
  {id:'wenzhongqiushu',   name:'稳中求胜', type:'defense',cost:1, value:10, desc:'10 护盾，下回合攻击+25%'},
  {id:'duoduo_biren',     name:'咄咄逼人', type:'attack', cost:2, value:14, desc:'14 伤害，敌人下回合意图 -4'},
  {id:'hunyin_zhongzhi',  name:'混水摸鱼', type:'steal', cost:1, value:0,  desc:'偷 6 血，随机偷一张敌方效果'},
];

// 敌人池：随层数增强
const ENEMY_TYPES = [
  {name:'山贼',      emoji:'🥷', hp:55, atk:7,  pattern:'simple'},
  {name:'流寇',      emoji:'🗡️', hp:70, atk:9,  pattern:'heavy'},
  {name:'邪道僧',    emoji:'🧙', hp:65, atk:8,  pattern:'buff'},
  {name:'铁甲卫',    emoji:'🛡️', hp:85, atk:10, pattern:'shield'},
  {name:'蛊毒师',    emoji:'🐍', hp:75, atk:8,  pattern:'poison'},
  {name:'魔将',      emoji:'👹', hp:100,atk:12, pattern:'rage'},
];
const BOSS = {name:'墨魔·祸乱', emoji:'👿', hp:160, atk:14, pattern:'boss'};
const FLOORS_PER_BOSS = 3;

const ENEMY_ATTACKS = ['黑虎掏心','横扫千军','暗箭伤人','雷霆一击'];

// ========== 音频（WebAudio 合成）==========
let audioCtx = null, muted = false;
function sfx(type) {
  if (muted || !audioCtx) return;
  try {
    let o = audioCtx.createOscillator(), g = audioCtx.createGain();
    let f = {hit:320, defend:200, heal:420, crit:600, hurt:180, win:520, lose:140, select:260, draft:350, start:440}[type] || 300;
    o.type = 'square'; o.frequency.value = f;
    g.gain.setValueAtTime(0.08, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.2);
  } catch(e) {}
}

// ========== 状态 ==========
let state, particles, hoveredCard, animQueue, draftCards, floatTexts = [], bestFloor = 0;
// localStorage 防护（隐私模式/禁用存储时降级为内存）
const store = {
  get(k) { try { return localStorage.getItem(k); } catch(e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch(e) {} },
};

function resetGame() {
  state = {
    screen: 'start', // start | battle | draft | reward | lose | win
    floor: 1, level: 0,
    player: { hp:80, maxHp:80, shield:0, energy:3, maxEnergy:5, dmgMul:1, dodge:false, reflect:false, burn:0, atkBuff:1 },
    enemy: null,
    deck: [], discard: [], hand: [], turn: 1, selectedCard: null,
    runScore: 0,
  };
  // 起始牌组：5 张基础成语
  state.deck = IDIOMS.slice(0, 5).map(c => ({...c}));
  state.discard = [];
  shuffleDeck();
  gameLog = [];
  animQueue = [];
  draftCards = [];
  floatTexts = [];
  drawCards(true);
}

// Fisher-Yates 洗牌
function shuffleDeck() {
  for (let i = state.deck.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    [state.deck[i], state.deck[j]] = [state.deck[j], state.deck[i]];
  }
}

// 抽牌：deck 空时把 discard 洗回 deck（经典循环）
function drawFromDeck(n) {
  let drawn = [];
  for (let k = 0; k < n; k++) {
    if (state.deck.length === 0) {
      if (state.discard.length === 0) break; // 全空
      state.deck = state.discard.splice(0);
      shuffleDeck();
    }
    drawn.push(state.deck.pop());
  }
  return drawn;
}

function spawnEnemy() {
  let lv = state.level;
  let isBoss = (state.floor % (FLOORS_PER_BOSS+1) === 0);
  let base = isBoss ? BOSS : ENEMY_TYPES[Math.min(lv, ENEMY_TYPES.length-1)];
  let scale = 1 + (state.floor-1)*0.12;
  state.enemy = {
    name: base.name, emoji: base.emoji, pattern: base.pattern, isBoss: isBoss,
    hp: Math.round(base.hp*scale), maxHp: Math.round(base.hp*scale),
    shield: 0, buffs: {}, burn: 0, poison: 0, atkIdx: 0, atkScale: 1, intent: null, rage: 0,
  };
}

function drawCards(firstTurn) {
  // 回合结束：手牌进弃牌堆
  if (!firstTurn && state.hand) {
    state.discard.push(...state.hand);
  }
  state.hand = [];
  let n = 5;
  let drawn = drawFromDeck(n);
  state.hand = drawn;
  state.player.energy = min(state.player.maxEnergy, state.player.energy + 3);
  state.player.dmgMul = 1; state.player.dodge = false; state.player.reflect = false;
  state.player.atkBuff = 1; state.selectedCard = null;
  if (state.enemy) computeIntent();
}

function computeIntent() {
  let e = state.enemy;
  let atkName = ENEMY_ATTACKS[e.atkIdx % 4];
  let dmg = Math.round((8 + e.atkIdx * 4) * e.atkScale);
  e.intent = { name: atkName, dmg: dmg };
  e.atkIdx++;
}

function dealDamage(target, amount, attacker) {
  amount = Math.floor(amount);
  if (amount <= 0) return 0;
  let actual = amount;
  if (target.shield > 0) {
    if (target.shield >= actual) { target.shield -= actual; return 0; }
    else { actual -= target.shield; target.shield = 0; }
  }
  target.hp -= actual;
  return actual;
}

function addFloat(x, y, txt, col) {
  floatTexts.push({x, y, txt, col, life: 45});
}

function playCard(card) {
  if (state.player.energy < card.cost) return;
  state.player.energy -= card.cost;
  let p = state.player, e = state.enemy;

  switch (card.type) {
    case 'attack': {
      let dmg = card.value * p.dmgMul * p.atkBuff;
      if (card.id === 'yijuguqin') dmg = 6 * min(3, state.turn);
      if (card.id === 'qianjunyifa') dmg = (e.hp > e.maxHp*0.5) ? 30 : 5;
      if (card.id === 'sheshenchuren') { dmg = 22; let cost = dealDamage(p, 6, e); addFloat(width/2, 480, '-6', PALETTE.red); }
      let actual = dealDamage(e, dmg, p);
      addFloat(width/2, 200, `-${Math.floor(dmg)}`, PALETTE.red);
      gameLog.push(`「${card.name}」造成 ${Math.floor(dmg)} 伤害`);
      if (card.id === 'huoshangjiaoyou') e.burn += 2;
      if (card.id === 'duoduo_biren') { e.intent.dmg = max(1, e.intent.dmg-4); }
      sfx(card.value >= 18 ? 'crit' : 'hit');
      break;
    }
    case 'defense': {
      let val = card.value;
      if (card.id === 'wenzhongqiushu') { p.atkBuff = 1.25; }
      p.shield += val;
      addFloat(width/2, 500, `+${val} 🛡`, PALETTE.shield);
      gameLog.push(`「${card.name}」获得 ${val} 护盾`);
      sfx('defend');
      break;
    }
    case 'heal': {
      let heal = card.value;
      if (card.id === 'guazhushishui') { p.burn = 0; }
      p.hp = min(p.maxHp, p.hp + heal);
      if (card.id === 'wangyangbulao') p.shield += 5;
      if (card.id === 'jingweitianhai') p.shield += 1;
      addFloat(width/2, 500, `+${heal} ❤`, PALETTE.green);
      gameLog.push(`「${card.name}」回复 ${heal} 生命`);
      sfx('heal');
      break;
    }
    case 'debuff': {
      if (card.id === 'fudichouxin') { e.buffs = {}; e.atkScale = 1; dealDamage(e, 10, p); addFloat(width/2, 200, '-10', PALETTE.red); }
      if (card.id === 'yiqiuhongru') { e.atkScale = Math.max(0.5, e.atkScale*0.8); }
      if (card.id === 'baimizhizhou') { e.intent.dmg = Math.round(e.intent.dmg*0.5); }
      gameLog.push(`「${card.name}」生效`);
      sfx('hit');
      break;
    }
    case 'buff': {
      if (card.id === 'huashuoshidian') p.dmgMul = 2;
      if (card.id === 'zhishangtanbing') {
        let extra = drawFromDeck(1);
        state.hand.push(...extra);
        p.maxEnergy += 1;
      }
      gameLog.push(`「${card.name}」发动`);
      sfx('select');
      break;
    }
    case 'counter': { p.reflect = true; gameLog.push(`「${card.name}」反弹姿态`); sfx('defend'); break; }
    case 'steal': {
      let stolen = min(card.id === 'anshiduliang' ? 12 : 8, e.hp);
      e.hp -= stolen; p.hp = min(p.maxHp, p.hp + stolen);
      if (card.id === 'anshiduliang') p.shield += 6;
      if (card.id === 'hunyin_zhongzhi' && e.buffs && Object.keys(e.buffs).length > 0) {
        let k = Object.keys(e.buffs)[0]; p.buffs = {...(p.buffs||{}), [k]: e.buffs[k]}; delete e.buffs[k];
      }
      addFloat(width/2, 500, `+${stolen} 💰`, PALETTE.goldDark);
      gameLog.push(`「${card.name}」偷取 ${stolen} 生命`);
      sfx('heal');
      break;
    }
    case 'escape': {
      if (card.id === 'jinchantuoqiao') {
        if (p.hp <= 30) { p.hp = min(p.maxHp, p.hp+20); gameLog.push('金蝉脱壳！回 20 血'); sfx('heal'); }
        else gameLog.push('生命高于 30，未触发');
      } else { // 走为上计
        p.hp = min(p.maxHp, p.hp + 5);
        gameLog.push('走为上计！回 5 血并结束回合');
        sfx('heal');
        endTurn();
        return;
      }
      break;
    }
  }
  if (gameLog.length > 6) gameLog.shift();
  state.selectedCard = null;
  // 打出的卡进弃牌堆（从手牌移除）
  let idx = state.hand.findIndex(c => c.id === card.id);
  if (idx >= 0) {
    state.hand.splice(idx, 1);
    state.discard.push(card);
  }
}

function endTurn() {
  enemyTurn();
}

function enemyTurn() {
  let e = state.enemy, p = state.player;
  let dmg = e.intent.dmg;

  // 敌人模式行为
  if (e.pattern === 'buff' && e.atkIdx % 3 === 0) {
    e.atkScale = Math.min(2, e.atkScale*1.3);
    gameLog.push(`邪道僧 蓄力！攻击 +30%`);
    drawCards(); state.turn++;
    return;
  }
  if (e.pattern === 'shield' && e.atkIdx % 3 === 1) {
    e.shield += 12;
    gameLog.push(`铁甲卫 举盾 +12`);
    drawCards(); state.turn++;
    return;
  }
  if (e.pattern === 'poison' && e.atkIdx % 3 === 2) {
    p.burn += 2; // 用灼烧机制模拟中毒
    gameLog.push(`蛊毒师 下毒！你受到灼烧`);
    drawCards(); state.turn++;
    return;
  }
  if (e.pattern === 'rage') {
    e.rage++;
    if (e.rage > 3) dmg = Math.round(dmg * 1.5);
  }
  if (e.pattern === 'heavy' && e.atkIdx % 3 === 0) dmg = Math.round(dmg*1.5);

  if (p.dodge) { gameLog.push('闪避！'); sfx('select'); p.dodge = false; }
  else if (p.reflect) {
    dealDamage(p, Math.floor(dmg*0.5));
    dealDamage(e, Math.floor(dmg*0.5));
    addFloat(width/2, 200, `反${Math.floor(dmg*0.5)}`, PALETTE.fire);
    gameLog.push(`反弹！双方各受 ${Math.floor(dmg*0.5)} 伤害`);
    sfx('hit');
    p.reflect = false;
  } else {
    let actual = dealDamage(p, dmg);
    if (actual > 0) {
      addFloat(width/2, 500, `-${actual}`, PALETTE.red);
      gameLog.push(`敌人「${e.intent.name}」造成 ${actual} 伤害`);
      shakeTimer = 10; shakeIntensity = 4;
      sfx('hurt');
    }
  }
  // 灼烧
  if (e.burn > 0) { dealDamage(e, 5); e.burn--; addFloat(width/2, 200, '-5🔥', PALETTE.fire); }
  if (p.burn > 0) { dealDamage(p, 5); p.burn--; addFloat(width/2, 500, '-5🔥', PALETTE.fire); }

  // 胜负判定
  if (e.hp <= 0) {
    onEnemyDefeated();
    return;
  }
  if (p.hp <= 0) {
    onPlayerDefeated();
    return;
  }
  drawCards();
  state.turn++;
}

function onEnemyDefeated() {
  sfx('win');
  state.runScore += 50 + state.floor*10;
  if (state.enemy.isBoss) {
    state.screen = 'win';
    bestFloor = max(bestFloor, state.floor);
    store.set('chengyuBest', bestFloor);
    gameLog = [`🏆 击败墨魔！通关第 ${state.floor} 层`];
  } else {
    state.screen = 'draft';
    draftCards = [];
    let pool = IDIOMS.filter(c => !state.deck.find(d => d.id === c.id));
    let n = min(3, pool.length);
    for (let i = 0; i < n; i++) {
      let idx = Math.floor(Math.random() * pool.length);
      draftCards.push(pool.splice(idx, 1)[0]);
    }
    gameLog = [`🎉 第 ${state.floor} 层胜利！选择一张新成语`];
  }
}

function onPlayerDefeated() {
  sfx('lose');
  state.screen = 'lose';
  bestFloor = max(bestFloor, state.floor-1);
  localStorage.setItem('chengyuBest', bestFloor);
  gameLog = ['败北... 点击重新开始'];
}

function nextFloor() {
  state.floor++;
  state.level = state.floor - 1;
  state.player.hp = min(state.player.maxHp, state.player.hp + 15);
  state.player.shield = 0;
  // 手牌进弃牌堆，不凭空消失
  if (state.hand && state.hand.length > 0) state.discard.push(...state.hand);
  state.hand = [];
  spawnEnemy();
  state.turn = 1;
  state.screen = 'battle';
  drawCards(true);
  gameLog = [`第 ${state.floor} 层 · ${state.enemy.name} 来袭！`];
}

// ========== p5 ==========
let shakeTimer = 0, shakeIntensity = 0;
let gameLog = [];

function setup() {
  let c = createCanvas(480, 800);
  pixelDensity(1);
  textFont('楷体');
  resetGame();
  particles = [];
  for (let i = 0; i < 15; i++) {
    particles.push({ x: Math.random()*width, y: Math.random()*height, vx:(Math.random()-0.5)*0.3, vy:Math.random()*0.3+0.1, size:Math.random()*2+1, alpha:Math.random()*30+10 });
  }
  try { audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e) {}
  bestFloor = parseInt(store.get('chengyuBest')||'0') || 0;
}

function draw() {
  background(PALETTE.paper);
  noStroke();
  for (let p of particles) {
    fill(PALETTE.inkLight.replace(')', `,${p.alpha/255})`).replace('rgb','rgba'));
    ellipse(p.x, p.y, p.size);
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0) p.x = width; if (p.x > width) p.x = 0;
    if (p.y > height) { p.y = 0; p.x = Math.random()*width; }
  }
  // 浮动伤害数字
  for (let i = floatTexts.length-1; i >= 0; i--) {
    let ft = floatTexts[i];
    ft.life--; ft.y -= 0.8;
    fill(ft.col); textSize(18); textAlign(CENTER);
    text(ft.txt, ft.x, ft.y);
    if (ft.life <= 0) floatTexts.splice(i, 1);
  }

  if (state.screen === 'start') drawStart();
  else if (state.screen === 'battle') drawBattle();
  else if (state.screen === 'draft') drawDraft();
  else if (state.screen === 'lose') drawLose();
  else if (state.screen === 'win') drawWin();
}

function drawStart() {
  fill(PALETTE.ink); textSize(44); textAlign(CENTER);
  text('成 语 肉 鸽', width/2, 240);
  fill(PALETTE.red); textSize(16);
  text('—— 墨韵 · 无尽爬塔 ——', width/2, 280);
  fill(PALETTE.inkLight); textSize(14); textAlign(CENTER);
  text('每层战胜敌人，选择新成语强化牌组', width/2, 360);
  text('每 3 层遭遇 Boss，击败即可通关', width/2, 385);
  text('⚡ 能量 · 🛡 护盾 · 🔥 灼烧 · 💰 偷取', width/2, 410);
  if (bestFloor > 0) { fill(PALETTE.gold); text(`最佳战绩：第 ${bestFloor} 层`, width/2, 450); }
  // 开始按钮
  let bw = 180, bh = 54, bx = width/2-90, by = 520;
  fill(PALETTE.red); noStroke(); rect(bx, by, bw, bh, 10);
  fill(255); textSize(20); text('开 始 冒 险', width/2, by+35);
}

function drawBattle() {
  push();
  if (shakeTimer > 0) {
    translate(Math.sin(shakeTimer*2)*shakeIntensity, Math.cos(shakeTimer*1.7)*shakeIntensity);
    shakeTimer--; shakeIntensity *= 0.8;
  }

  // 顶层/敌人
  fill(PALETTE.inkLight); textSize(14); textAlign(LEFT);
  text(`第 ${state.floor} 层`, 30, 28);
  if (state.enemy?.isBoss) { fill(PALETTE.red); textSize(12); text('👑 BOSS', 90, 28); }
  drawEnemy();

  // HP bars
  drawHPBar(30, 330, state.enemy.hp, state.enemy.maxHp, PALETTE.ink, state.enemy.name);
  drawHPBar(30, 540, state.player.hp, state.player.maxHp, PALETTE.red, '玩家');

  // Turn
  fill(PALETTE.inkLight); textSize(13); textAlign(RIGHT);
  text(`第 ${state.turn} 回合`, width-30, 28);

  // Enemy intent
  if (state.enemy.intent) {
    fill(PALETTE.red); textSize(13); textAlign(CENTER);
    text(`敌方: ${state.enemy.intent.name} (${state.enemy.intent.dmg})`, width/2, 135);
  }

  // Log
  fill(PALETTE.ink); textSize(12); textAlign(LEFT);
  for (let i = gameLog.length-1; i >= 0; i--) {
    fill(i===gameLog.length-1?PALETTE.red:PALETTE.inkLight);
    text(gameLog[i], 30, 160 + (gameLog.length-1-i)*17);
  }

  // Energy / status
  fill(PALETTE.ink); textSize(13); textAlign(LEFT);
  text(`⚡ ${state.player.energy}/${state.player.maxEnergy}`, 30, 190);
  if (state.player.shield > 0) { fill(PALETTE.shield); text(`🛡 ${state.player.shield}`, 115, 190); }
  if (state.player.burn > 0) { fill(PALETTE.fire); text(`🔥${state.player.burn}`, 170, 190); }
  if (state.player.dmgMul > 1) { fill(PALETTE.red); text('✖2 伤害', 210, 190); }

  // 牌库/弃牌数量
  fill(PALETTE.inkLight); textSize(11); textAlign(LEFT);
  text(`牌库 ${state.deck.length}`, 30, 214);
  if (state.discard.length > 0) {
    fill(PALETTE.goldDark); text(`弃牌 ${state.discard.length}`, 95, 214);
  }

  // Score
  fill(PALETTE.gold); textSize(12); textAlign(RIGHT);
  text(`得分 ${state.runScore}`, width-30, 190);

  // Cards
  hoveredCard = null;
  let cardW = 82, cardH = 135;
  let startX = 30, gap = 88;
  for (let i = 0; i < state.hand.length; i++) {
    let card = state.hand[i];
    let cx = startX + i * gap;
    let cy = 585;
    let hover = mouseX > cx && mouseX < cx+cardW && mouseY > cy && mouseY < cy+cardH;
    if (hover) hoveredCard = i;
    let isSelected = state.selectedCard === card.id;
    if (isSelected && state.player.energy >= card.cost) {
      drawCard(cx, cy-10, cardW, cardH, card, true);
    } else {
      drawCard(cx, cy, cardW, cardH, card, hover);
    }
    if (isSelected) {
      noFill(); stroke(PALETTE.red); strokeWeight(2);
      rect(cx-2, cy-12, cardW+4, cardH+4, 6);
    }
  }

  // End turn button
  let bx = width-80, by = 555;
  fill(PALETTE.ink); noStroke(); rect(bx, by, 60, 26, 5);
  fill(255); textSize(11); textAlign(CENTER);
  text('结束回合', bx+30, by+18);

  pop();
}

function drawCard(x, y, w, h, card, active) {
  let canPlay = state.player.energy >= card.cost;
  let baseY = active ? y-5 : y;

  noStroke();
  fill(canPlay ? '#faf5eb' : '#e8e0d5');
  rect(x, baseY, w, h, 5);

  noFill();
  stroke(PALETTE.gold); strokeWeight(1.5);
  rect(x, baseY, w, h, 5);

  // Cost
  noStroke();
  fill(canPlay ? PALETTE.red : PALETTE.inkLight);
  ellipse(x+w-14, baseY+14, 24);
  fill(255); textSize(14); textAlign(CENTER);
  text(card.cost, x+w-14, baseY+19);

  // Name
  fill(PALETTE.ink); textSize(14.5); textAlign(CENTER);
  text(card.name, x+w/2, baseY+40);

  // Type badge
  let typeColors = {attack:PALETTE.red, defense:PALETTE.shield, heal:PALETTE.green, buff:PALETTE.gold, debuff:PALETTE.ink, counter:PALETTE.fire, steal:PALETTE.goldDark, escape:PALETTE.inkLight};
  let typeNames = {attack:'攻', defense:'守', heal:'愈', buff:'强', debuff:'破', counter:'反', steal:'窃', escape:'遁'};
  fill(typeColors[card.type] || PALETTE.ink);
  textSize(11); text(typeNames[card.type] || '?', x+w/2, baseY+56);

  // Desc (两行)
  fill(PALETTE.inkLight); textSize(9); textAlign(CENTER);
  let desc = card.desc;
  if (desc.length > 10) {
    text(desc.substring(0, 10), x+w/2, baseY+74);
    text(desc.substring(10), x+w/2, baseY+88);
  } else {
    text(desc, x+w/2, baseY+74);
  }

  // Seal
  fill(typeColors[card.type] || PALETTE.inkLight);
  noStroke(); rect(x+5, baseY+h-22, 22, 14, 2);
  fill(255); textSize(8);
  text(typeNames[card.type], x+16, baseY+h-12);
}

function drawEnemy() {
  let ex = width/2, ey = 230;
  noStroke();
  for (let i = 3; i >= 0; i--) {
    fill(PALETTE.ink.replace(')', `,${0.05+i*0.03})`).replace('rgb','rgba'));
    ellipse(ex, ey+5, 70+i*10, 70+i*10);
  }
  // 敌人头像（emoji 大字）
  textSize(72); textAlign(CENTER);
  text(state.enemy?.emoji || '👹', ex, ey+24);
  // 敌人名
  fill(PALETTE.ink); textSize(14); textAlign(CENTER);
  text(state.enemy?.name || '', ex, ey+58);
  // Boss 红光
  if (state.enemy?.isBoss) {
    fill(PALETTE.red); textSize(12);
    text('⭐ 首领 ⭐', ex, ey+80);
  }
}

function drawHPBar(x, y, hp, maxHp, col, label) {
  fill(PALETTE.inkLight); textSize(11); textAlign(LEFT);
  text(`${label}`, x, y-2);
  noStroke();
  fill(PALETTE.ink.replace(')','').replace('rgb','rgba')+',0.2)');
  rect(x, y, 120, 8, 4);
  let pct = max(0, hp/maxHp);
  fill(col); rect(x, y, 120*pct, 8, 4);
  fill(PALETTE.ink); textSize(10); textAlign(RIGHT);
  text(`${Math.max(0,hp)}/${maxHp}`, x+120, y-2);
}

function drawDraft() {
  fill(PALETTE.ink); textSize(18); textAlign(CENTER);
  text('选择一张成语入牌', width/2, 200);

  for (let i = 0; i < draftCards.length; i++) {
    let card = draftCards[i];
    let cx = 80 + i * 130;
    let cy = 300;
    let hover = mouseX > cx-55 && mouseX < cx+55 && mouseY > cy-75 && mouseY < cy+75;
    drawCard(cx-41, cy-70, 82, 140, card, hover);
  }

  fill(PALETTE.inkLight); textSize(12);
  text('点击卡牌选择 · 之后进入下一层', width/2, 480);
}

function drawLose() {
  fill(PALETTE.red); textSize(24); textAlign(CENTER);
  text('败 北', width/2, 280);
  fill(PALETTE.inkLight); textSize(14);
  text(`抵达第 ${max(1,state.floor)} 层 · 得分 ${state.runScore}`, width/2, 320);
  if (bestFloor > 0) { fill(PALETTE.gold); text(`最佳战绩：第 ${bestFloor} 层`, width/2, 350); }
  fill(PALETTE.inkLight); textSize(14);
  text('点击重新挑战', width/2, 420);
}

function drawWin() {
  fill(PALETTE.gold); textSize(26); textAlign(CENTER);
  text('🏆 通 关 成 功 🏆', width/2, 280);
  fill(PALETTE.inkLight); textSize(14);
  text(`击败墨魔 · 得分 ${state.runScore}`, width/2, 320);
  fill(PALETTE.ink); textSize(16);
  text('点击再来一局', width/2, 420);
}

function handleTap() {
  if (state.screen === 'start') {
    if (mouseX > width/2-90 && mouseX < width/2+90 && mouseY > 520 && mouseY < 574) {
      sfx('start');
      state.floor = 1; state.level = 0;
      spawnEnemy();
      state.screen = 'battle';
      gameLog = [`第 1 层 · ${state.enemy.name} 来袭！`];
      state.turn = 1;
      computeIntent();
      // resetGame 已抽好手牌，这里不再重新抽
    }
    return;
  }
  if (state.screen === 'draft') {
    for (let i = 0; i < draftCards.length; i++) {
      let cx = 80 + i * 130, cy = 300;
      if (mouseX > cx-55 && mouseX < cx+55 && mouseY > cy-75 && mouseY < cy+75) {
        state.deck.push({...draftCards[i]});
        gameLog = [`获得「${draftCards[i].name}」！`];
        sfx('draft');
        nextFloor();
        return;
      }
    }
    return;
  }
  if (state.screen === 'lose' || state.screen === 'win') {
    resetGame();
    return;
  }

  // End turn button
  if (mouseX > width-80 && mouseX < width-20 && mouseY > 555 && mouseY < 581) {
    endTurn();
    return;
  }

  // Card selection（按 id 匹配，避免出牌后索引错位）
  if (hoveredCard !== null && state.hand[hoveredCard]) {
    let card = state.hand[hoveredCard];
    let selCard = state.selectedCard !== null ? state.hand.find(c => c.id === state.selectedCard) : null;
    if (selCard && selCard.id === card.id && state.player.energy >= card.cost) {
      playCard(card);
    } else {
      state.selectedCard = card.id;
      sfx('select');
    }
  }
}

function mousePressed() { handleTap(); }
function touchStarted() { handleTap(); return false; }

function keyPressed() {
  if (key === 'r') resetGame();
  if (key === 'm') muted = !muted;
}

function windowResized() { resizeCanvas(480, 800); }
</script>
